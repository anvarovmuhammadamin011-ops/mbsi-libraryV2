<svg xmlns="http://www.w3.org/2000/svg" width="200" height="280" viewBox="0 0 200 280">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5DADE2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3f8fc4;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Book shape -->
  <rect x="10" y="10" width="180" height="260" rx="8" fill="url(#grad)" filter="url(#shadow)"/>
  
  <!-- Spine -->
  <rect x="10" y="10" width="15" height="260" rx="4" fill="#3585ba"/>
  
  <!-- Title area -->
  <rect x="30" y="20" width="150" height="120" rx="4" fill="rgba(255,255,255,0.15)"/>
  
  <!-- Emoji -->
  <text x="105" y="80" font-size="48" text-anchor="middle" fill="white">🌌</text>
  
  <!-- Title -->
  <text x="105" y="130" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">
    <tspan x="105" dy="0">A Brief History of</tspan><tspan x="105" dy="18">Time</tspan>
  </text>
  
  <!-- Divider -->
  <line x1="40" y1="160" x2="160" y2="160" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
  
  <!-- Author -->
  <text x="105" y="185" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.8)" text-anchor="middle">
    Stephen Hawking
  </text>
  
  <!-- Decorative elements -->
  <circle cx="160" cy="240" r="20" fill="rgba(255,255,255,0.1)"/>
  <circle cx="40" cy="230" r="15" fill="rgba(255,255,255,0.08)"/>
</svg>